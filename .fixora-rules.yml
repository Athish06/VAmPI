rules:
- id: fixora-wrapper-get-user
  patterns:
  - pattern-inside: "def get_user(...):\n  ..."
  - pattern-either:
    - pattern: db.session.execute(...)
    - pattern: $OBJ.execute(...)
    - pattern: execute(...)
  message: '### SQL Injection via `username`


    **Vulnerable Sink:** Passes untrusted data directly to `db.session.execute`.


    **Live Exploit Vector:**

    ```python\n// Target Function: get_user()\n// Parameter: username\n\n// Attacker
    executes:\nget_user(username = 1'' OR 1=1 --)\n```


    **Outcome:**

    The attacker-controlled username is concatenated into the SQL WHERE clause, so
    the payload converts the predicate into an always-true condition.


    **Data at Risk (Impact):**

    Attackers can exfiltrate all rows from the users table and bypass authorization
    checks tied to user scoping.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: SQL Injection
    confidence: HIGH
    wrapper_defined_in: models/user_model.py
    wraps:
    - db.session.execute
    modules_used:
    - sqlalchemy
    vulnerable_parameter: username
    malicious_payload: 1' OR 1=1 --
    exploit_explanation: The attacker-controlled username is concatenated into the
      SQL WHERE clause, so the payload converts the predicate into an always-true
      condition.
    exploit_injected_example: get_user(username = 1' OR 1=1 --)
    impact_summary: Attackers can exfiltrate all rows from the users table and bypass
      authorization checks tied to user scoping.
    cwe:
    - CWE-89
    owasp:
    - A03:2021
- id: fixora-wrapper-login-user
  patterns:
  - pattern-inside: "def login_user(...):\n  ..."
  - pattern-either:
    - pattern: User.query.filter_by(...)
    - pattern: $OBJ.filter_by(...)
    - pattern: filter_by(...)
  message: '### Plaintext Password via `request_data.get(''password'')`


    **Vulnerable Sink:** Passes untrusted data directly to `User.query.filter_by`.


    **Live Exploit Vector:**

    ```python\n// Target Function: login_user()\n// Parameter: request_data.get(''password'')\n\n//
    Attacker executes:\nlogin_user(request_data.get(''password'') = password123)\n```


    **Outcome:**

    The attacker can try to login with a known password, and the comparison will be
    done in plaintext.


    **Data at Risk (Impact):**

    Attackers can gain unauthorized access to user accounts by trying known passwords.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Plaintext Password
    confidence: HIGH
    wrapper_defined_in: api_views/users.py
    wraps:
    - User.query.filter_by
    modules_used:
    - flask
    - models
    vulnerable_parameter: request_data.get('password')
    malicious_payload: password123
    exploit_explanation: The attacker can try to login with a known password, and
      the comparison will be done in plaintext.
    exploit_injected_example: login_user(request_data.get('password') = password123)
    impact_summary: Attackers can gain unauthorized access to user accounts by trying
      known passwords.
    cwe:
    - CWE-256
    - CWE-916
    owasp:
    - A02:2021
- id: fixora-wrapper-update-email
  patterns:
  - pattern-inside: "def update_email(...):\n  ..."
  - pattern-either:
    - pattern: re.search(...)
    - pattern: $OBJ.search(...)
    - pattern: search(...)
  message: '### Input Validation Failure via `request_data.get(''email'')`


    **Vulnerable Sink:** Passes untrusted data directly to `re.search`.


    **Live Exploit Vector:**

    ```python\n// Target Function: update_email()\n// Parameter: request_data.get(''email'')\n\n//
    Attacker executes:\nupdate_email(request_data.get(''email'') = a@b.c)\n```


    **Outcome:**

    The attacker can provide a specially crafted email address that causes the regex
    engine to consume excessive resources.


    **Data at Risk (Impact):**

    Attackers can cause a denial-of-service by providing a malicious email address.'
  severity: WARNING
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Input Validation Failure
    confidence: MEDIUM
    wrapper_defined_in: api_views/users.py
    wraps:
    - re.search
    modules_used:
    - re
    - flask
    - models
    vulnerable_parameter: request_data.get('email')
    malicious_payload: a@b.c
    exploit_explanation: The attacker can provide a specially crafted email address
      that causes the regex engine to consume excessive resources.
    exploit_injected_example: update_email(request_data.get('email') = a@b.c)
    impact_summary: Attackers can cause a denial-of-service by providing a malicious
      email address.
    cwe:
    - CWE-400
    - CWE-1333
    owasp:
    - A03:2021
- id: fixora-wrapper-get-by-title
  patterns:
  - pattern-inside: "def get_by_title(...):\n  ..."
  - pattern-either:
    - pattern: Book.query.filter_by(...)
    - pattern: $OBJ.filter_by(...)
    - pattern: filter_by(...)
  message: '### IDOR / Broken Access Control via `book_title`


    **Vulnerable Sink:** Passes untrusted data directly to `Book.query.filter_by`.


    **Live Exploit Vector:**

    ```python\n// Target Function: get_by_title()\n// Parameter: book_title\n\n//
    Attacker executes:\nget_by_title(book_title = another_user_book)\n```


    **Outcome:**

    The attacker can access books that belong to other users by providing the book
    title.


    **Data at Risk (Impact):**

    Attackers can access sensitive information by exploiting the broken access control.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: IDOR / Broken Access Control
    confidence: HIGH
    wrapper_defined_in: api_views/books.py
    wraps:
    - Book.query.filter_by
    modules_used:
    - flask
    - models
    vulnerable_parameter: book_title
    malicious_payload: another_user_book
    exploit_explanation: The attacker can access books that belong to other users
      by providing the book title.
    exploit_injected_example: get_by_title(book_title = another_user_book)
    impact_summary: Attackers can access sensitive information by exploiting the broken

rules:
- id: fixora-wrapper-get-user
  patterns:
  - pattern-inside: "def get_user(...):\n  ..."
  - pattern-either:
    - pattern: db.session.execute(...)
    - pattern: $OBJ.execute(...)
    - pattern: execute(...)
  message: 'SQL Injection via `username`

    Vulnerable Sink: Passes untrusted data directly to `db.session.execute`.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: SQL Injection
    confidence: HIGH
    wrapper_defined_in: models/user_model.py
    wraps:
    - db.session.execute
    modules_used:
    - sqlalchemy
    vulnerable_parameter: username
    malicious_payload: 1 OR 1=1 --
    exploit_explanation: The attacker-controlled username is concatenated into the
      SQL WHERE clause, so the payload converts the predicate into an always-true
      condition.
    exploit_injected_example: get_user(username = 1 OR 1=1 --)
    impact_summary: Attackers can exfiltrate all rows from the table and bypass authorization
      checks tied to user scoping.
    cwe:
    - CWE-89
    owasp:
    - A03:2021
- id: fixora-wrapper-register-user
  patterns:
  - pattern-inside: "def register_user(...):\n  ..."
  - pattern-either:
    - pattern: db.session.add(...)
    - pattern: $OBJ.add(...)
    - pattern: add(...)
    - pattern: db.session.commit(...)
    - pattern: $OBJ.commit(...)
    - pattern: commit(...)
  message: 'Mass Assignment via `request_data`

    Vulnerable Sink: Passes untrusted data directly to `db.session.add, db.session.commit`.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Mass Assignment
    confidence: HIGH
    wrapper_defined_in: api_views/users.py
    wraps:
    - db.session.add
    - db.session.commit
    modules_used:
    - models
    - config
    - jsonschema
    - flask
    vulnerable_parameter: request_data
    malicious_payload: '{"admin": true}'
    exploit_explanation: The attacker can manipulate the request data to assign arbitrary
      values to the User model, potentially escalating privileges.
    exploit_injected_example: 'register_user(request_data = {"admin": true})'
    impact_summary: Attackers can create users with elevated privileges, compromising
      the security of the application.
    cwe:
    - CWE-915
    owasp:
    - A03:2021
- id: fixora-wrapper-login-user
  patterns:
  - pattern-inside: "def login_user(...):\n  ..."
  - pattern-either:
    - pattern: User.query.filter_by(...)
    - pattern: $OBJ.filter_by(...)
    - pattern: filter_by(...)
  message: 'Plaintext Password via `request_data.get(''password'')`

    Vulnerable Sink: Passes untrusted data directly to `User.query.filter_by`.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Plaintext Password
    confidence: HIGH
    wrapper_defined_in: api_views/users.py
    wraps:
    - User.query.filter_by
    modules_used:
    - jsonschema
    - flask
    - models
    vulnerable_parameter: request_data.get('password')
    malicious_payload: null
    exploit_explanation: The application stores passwords in plaintext, allowing attackers
      to obtain them if they gain access to the database.
    exploit_injected_example: ''
    impact_summary: Attackers can obtain plaintext passwords, compromising user accounts
      and potentially leading to further attacks.
    cwe:
    - CWE-256
    - CWE-916
    owasp:
    - A02:2021

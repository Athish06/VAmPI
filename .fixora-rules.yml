rules:
- id: fixora-wrapper-get-user
  patterns:
  - pattern-inside: "def get_user(...):\n  ..."
  - pattern-either:
    - pattern: db.session.execute(...)
    - pattern: $OBJ.execute(...)
    - pattern: execute(...)
  message: 'SQL Injection via `username`

    Vulnerable Sink: Passes untrusted data directly to `db.session.execute`.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: SQL Injection
    confidence: HIGH
    wrapper_defined_in: models/user_model.py
    wraps:
    - db.session.execute
    modules_used:
    - sqlalchemy
    vulnerable_parameter: username
    malicious_payload: ''' OR 1=1 --'
    exploit_explanation: The attacker-controlled username is concatenated into the
      SQL query, allowing for arbitrary SQL execution.
    exploit_injected_example: get_user(username = ' OR 1=1 --)
    impact_summary: Attackers can exfiltrate all user data and potentially execute
      system-level commands.
    cwe:
    - CWE-89
    owasp:
    - A03:2021
- id: fixora-wrapper-login-user
  patterns:
  - pattern-inside: "def login_user(...):\n  ..."
  - pattern-either:
    - pattern: User.query.filter_by(...)
    - pattern: $OBJ.filter_by(...)
    - pattern: filter_by(...)
  message: 'Plaintext Password via `request_data.get(''password'')`

    Vulnerable Sink: Passes untrusted data directly to `User.query.filter_by`.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Plaintext Password
    confidence: HIGH
    wrapper_defined_in: api_views/users.py
    wraps:
    - User.query.filter_by
    modules_used:
    - models
    vulnerable_parameter: request_data.get('password')
    malicious_payload: ''
    exploit_explanation: The application stores passwords in plaintext and compares
      them directly, allowing for easy password guessing.
    exploit_injected_example: ''
    impact_summary: Attackers can easily obtain user passwords and gain unauthorized
      access to accounts.
    cwe:
    - CWE-256
    - CWE-916
    owasp:
    - A02:2021
- id: fixora-wrapper-register-user
  patterns:
  - pattern-inside: "def register_user(...):\n  ..."
  - pattern-either:
    - pattern: User(...)
    - pattern: $OBJ.User(...)
  message: 'Mass Assignment via `request_data`

    Vulnerable Sink: Passes untrusted data directly to `User`.'
  severity: WARNING
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Mass Assignment
    confidence: MEDIUM
    wrapper_defined_in: api_views/users.py
    wraps:
    - User
    modules_used:
    - models
    vulnerable_parameter: request_data
    malicious_payload: '{"admin": true}'
    exploit_explanation: The application allows users to register with arbitrary fields,
      potentially allowing for privilege escalation.
    exploit_injected_example: 'register_user(request_data = {"admin": true})'
    impact_summary: Attackers can potentially gain elevated privileges and access
      sensitive data.
    cwe:
    - CWE-915
    owasp:
    - A03:2021

- id: fixora-wrapper-get-user
  patterns:
  - pattern-inside: "def get_user(...):\n  ..."
  - pattern-either:
    - pattern: db.session.execute(...)
    - pattern: $OBJ.execute(...)
    - pattern: execute(...)
  message: '### SQL Injection via `username`


    **Vulnerable Sink:** Passes untrusted data directly to `db.session.execute`.


    **Live Exploit Vector:**

    ```python\n// Target Function: get_user()\n// Parameter: username\n\n// Attacker
    executes:\nget_user(username = '' OR 1=1 --)\n```


    **Outcome:**

    The attacker-controlled username is concatenated into the SQL WHERE clause, so
    the payload converts the predicate into an always-true condition.


    **Data at Risk (Impact):**

    Attackers can exfiltrate all rows from the users table and bypass authorization
    checks tied to user scoping.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: SQL Injection
    confidence: HIGH
    wrapper_defined_in: models/user_model.py
    wraps:
    - db.session.execute
    modules_used:
    - sqlalchemy
    vulnerable_parameter: username
    malicious_payload: ''' OR 1=1 --'
    exploit_explanation: The attacker-controlled username is concatenated into the
      SQL WHERE clause, so the payload converts the predicate into an always-true
      condition.
    exploit_injected_example: get_user(username = ' OR 1=1 --)
    impact_summary: Attackers can exfiltrate all rows from the users table and bypass
      authorization checks tied to user scoping.
    cwe:
    - CWE-89
    owasp:
    - A03:2021
- id: fixora-wrapper-register-user
  patterns:
  - pattern-inside: "def register_user(...):\n  ..."
  - pattern-either:
    - pattern: db.session.add(...)
    - pattern: $OBJ.add(...)
    - pattern: add(...)
    - pattern: db.session.commit(...)
    - pattern: $OBJ.commit(...)
    - pattern: commit(...)
  message: '### Plaintext Password via `password`


    **Vulnerable Sink:** Passes untrusted data directly to `db.session.add, db.session.commit`.


    **Live Exploit Vector:**

    ```python\n// Target Function: register_user()\n// Parameter: password\n\n// Attacker
    executes:\nregister_user(password = attacker_password)\n```


    **Outcome:**

    The attacker-controlled password is stored in plaintext, allowing attackers to
    access user accounts if the database is compromised.


    **Data at Risk (Impact):**

    Attackers can access user accounts and sensitive data if the database is compromised,
    leading to unauthorized access and potential data breaches.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Plaintext Password
    confidence: HIGH
    wrapper_defined_in: models/user_model.py
    wraps:
    - db.session.add
    - db.session.commit
    modules_used:
    - config
    - models
    - random
    vulnerable_parameter: password
    malicious_payload: attacker_password
    exploit_explanation: The attacker-controlled password is stored in plaintext,
      allowing attackers to access user accounts if the database is compromised.
    exploit_injected_example: register_user(password = attacker_password)
    impact_summary: Attackers can access user accounts and sensitive data if the database
      is compromised, leading to unauthorized access and potential data breaches.
    cwe:
    - CWE-256
    - CWE-916
    owasp:
    - A02:2021

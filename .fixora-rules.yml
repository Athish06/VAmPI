    - A03:2021
- id: fixora-wrapper-get-by-title
  patterns:
  - pattern-inside: "def get_by_title(...):\n  ..."
  - pattern-either:
    - pattern: Book.query.filter_by(...)
    - pattern: $OBJ.filter_by(...)
    - pattern: filter_by(...)
  message: '### IDOR / Broken Access Control via `book_title`


    **Vulnerable Sink:** Passes untrusted data directly to `Book.query.filter_by`.


    **Live Exploit Vector:**

    ```python\n// Target Function: get_by_title()\n// Parameter: book_title\n\n//
    Attacker executes:\nget_by_title(book_title = test)\n```


    **Outcome:**

    The attacker-controlled book title is passed to the Book query filter, allowing
    the attacker to access arbitrary books.


    **Data at Risk (Impact):**

    Attackers can access arbitrary books, potentially leading to unauthorized access
    to sensitive data.'
  severity: ERROR
  languages:
  - python

    - pattern: Response(...)
    - pattern: $OBJ.Response(...)
  message: '### Missing Authentication via `username`


    **Vulnerable Sink:** Passes untrusted data directly to `User.get_user, Response`.


    **Live Exploit Vector:**

    ```python\n// Target Function: get_by_username()\n// Parameter: username\n\n//
    Attacker executes:\nget_by_username(username = <malicious_data>)\n```


    **Outcome:**

    An attacker can access any user''s data without authentication by providing the
    username.


    **Data at Risk (Impact):**

    Attackers can access sensitive user data without authorization, potentially leading
    to data breaches or identity theft.'

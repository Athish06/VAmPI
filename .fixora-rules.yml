    - re
    - config
    - jsonschema
    - models
    - flask
    vulnerable_parameter: request_data.get('email')
    malicious_payload: a@b.c
    exploit_explanation: The attacker-controlled email address is passed to the vulnerable
      regex, potentially causing a denial-of-service attack.
    exploit_injected_example: update_email(request_data.get('email') = a@b.c)
    impact_summary: Attackers can cause a denial-of-service attack, potentially leading

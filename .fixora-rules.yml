  message: '### Missing Authentication via `request_data`


    **Vulnerable Sink:** Passes untrusted data directly to `request.get_json, User.query.filter_by`.


    **Live Exploit Vector:**

    ```python\n// Target Function: login_user()\n// Parameter: request_data\n\n//
    Attacker executes:\nlogin_user(request_data = {})\n```



rules:
- id: fixora-wrapper-get-user
  patterns:
  - pattern-inside: "def get_user(...):\n  ..."
  - pattern-either:
    - pattern: db.session.execute(...)
    - pattern: $OBJ.execute(...)
    - pattern: execute(...)
  message: '### 🚨 SQL Injection via `username`


    **Vulnerable Sink:** Passes untrusted data directly to `db.session.execute`.


    **Live Exploit Vector:**

    ```python\n// Target Function: get_user()\n// Parameter: username\n\n// Attacker
    executes:\nget_user(username = 1'' OR ''1''=''1)\n```


    **Outcome:**

    The attacker-controlled username is concatenated into the SQL query, so the payload
    converts the predicate into an always-true condition.


    **Data at Risk (Impact):**

    Attackers can exfiltrate all rows from the users table and bypass authorization
    checks tied to user scoping.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: SQL Injection
    confidence: HIGH
    wrapper_defined_in: models/user_model.py
    wraps:
    - db.session.execute
    modules_used:
    - sqlalchemy
    vulnerable_parameter: username
    malicious_payload: 1' OR '1'='1
    exploit_explanation: The attacker-controlled username is concatenated into the
      SQL query, so the payload converts the predicate into an always-true condition.
    exploit_injected_example: get_user(username = 1' OR '1'='1)
    impact_summary: Attackers can exfiltrate all rows from the users table and bypass
      authorization checks tied to user scoping.
    cwe:
    - CWE-89
    owasp:
    - A03:2021
- id: fixora-wrapper-get-by-title
  patterns:
  - pattern-inside: "def get_by_title(...):\n  ..."
  - pattern-either:
    - pattern: Book.query.filter_by(...)
    - pattern: $OBJ.filter_by(...)
    - pattern: filter_by(...)
  message: '### 🚨 IDOR / Broken Access Control via `book_title`


    **Vulnerable Sink:** Passes untrusted data directly to `Book.query.filter_by`.


    **Live Exploit Vector:**

    ```python\n// Target Function: get_by_title()\n// Parameter: book_title\n\n//
    Attacker executes:\nget_by_title(book_title = any book title)\n```


    **Outcome:**

    The attacker can access any book by providing its title, bypassing the authorization
    check.


    **Data at Risk (Impact):**

    Attackers can access books that do not belong to them, potentially exposing sensitive
    information.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: IDOR / Broken Access Control
    confidence: HIGH
    wrapper_defined_in: api_views/books.py
    wraps:
    - Book.query.filter_by
    modules_used:
    - models
    - api_views
    - flask
    vulnerable_parameter: book_title
    malicious_payload: any book title
    exploit_explanation: The attacker can access any book by providing its title,
      bypassing the authorization check.
    exploit_injected_example: get_by_title(book_title = any book title)
    impact_summary: Attackers can access books that do not belong to them, potentially
      exposing sensitive information.
- id: fixora-wrapper-register-user
  patterns:
  - pattern-inside: "def register_user(...):\n  ..."
  - pattern-either:
    - pattern: User.query.filter_by(...)
    - pattern: $OBJ.filter_by(...)
    - pattern: filter_by(...)
    - pattern: db.session.add(...)
    - pattern: $OBJ.add(...)
    - pattern: add(...)
    - pattern: db.session.commit(...)
    - pattern: $OBJ.commit(...)
    - pattern: commit(...)
  message: '### 🚨 Business Logic Flaw via `admin`


    **Vulnerable Sink:** Passes untrusted data directly to `User.query.filter_by,
    db.session.add, db.session.commit`.


    **Live Exploit Vector:**

    ```python\n// Target Function: register_user()\n// Parameter: admin\n\n// Attacker
    executes:\nregister_user(admin = true)\n```


    **Outcome:**

    The attacker can register as an admin by providing ''admin'': true in the registration
    request.


    **Data at Risk (Impact):**

    Attackers can elevate their privileges to admin, potentially allowing them to
    perform unauthorized actions.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Business Logic Flaw
    confidence: HIGH
    wrapper_defined_in: api_views/users.py
    wraps:
    - User.query.filter_by
    - db.session.add
    - db.session.commit
    modules_used:
    - jsonschema
    - config
    - models
    - flask
    vulnerable_parameter: admin
    malicious_payload: 'true'
    exploit_explanation: 'The attacker can register as an admin by providing ''admin'':
      true in the registration request.'
    exploit_injected_example: register_user(admin = true)
    impact_summary: Attackers can elevate their privileges to admin, potentially allowing
      them to perform unauthorized actions.

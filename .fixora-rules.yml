rules:
- id: fixora-wrapper-get-user
  patterns:
  - pattern-inside: "def get_user(...):\n  ..."
  - pattern-either:
    - pattern: db.session.execute(...)
    - pattern: $OBJ.execute(...)
    - pattern: execute(...)
  message: '### SQL Injection via `username`


    **Vulnerable Sink:** Passes untrusted data directly to `db.session.execute`.


    **Live Exploit Vector:**

    ```python\n// Target Function: get_user()\n// Parameter: username\n\n// Attacker
    executes:\nget_user(username = '' OR 1=1 --)\n```


    **Outcome:**

    The attacker-controlled username is concatenated into the SQL WHERE clause, so
    the payload converts the predicate into an always-true condition.


    **Data at Risk (Impact):**

    Attackers can exfiltrate all rows from the users table and bypass authorization
    checks tied to user scoping.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: SQL Injection
    confidence: HIGH
    wrapper_defined_in: models/user_model.py
    wraps:
    - db.session.execute
    modules_used:
    - sqlalchemy
    vulnerable_parameter: username
    malicious_payload: ''' OR 1=1 --'
    exploit_explanation: The attacker-controlled username is concatenated into the
      SQL WHERE clause, so the payload converts the predicate into an always-true
      condition.
    exploit_injected_example: get_user(username = ' OR 1=1 --)
    impact_summary: Attackers can exfiltrate all rows from the users table and bypass
      authorization checks tied to user scoping.
    cwe:
    - CWE-89
    owasp:
    - A03:2021
- id: fixora-wrapper-login-user
  patterns:
  - pattern-inside: "def login_user(...):\n  ..."
  - pattern-either:
    - pattern: User.query.filter_by(...)
    - pattern: $OBJ.filter_by(...)
    - pattern: filter_by(...)
  message: '### Plaintext Password via `request_data.get(''password'')`


    **Vulnerable Sink:** Passes untrusted data directly to `User.query.filter_by`.


    **Live Exploit Vector:**

    ```python\n// Target Function: login_user()\n// Parameter: request_data.get(''password'')\n\n//
    Attacker executes:\nlogin_user(request_data.get(''password'') = any_password)\n```


    **Outcome:**

    The attacker can try any password to gain unauthorized access to the system.


    **Data at Risk (Impact):**

    Attackers can gain unauthorized access to user accounts and sensitive data.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Plaintext Password
    confidence: HIGH
    wrapper_defined_in: api_views/users.py
    wraps:
    - User.query.filter_by
    modules_used:
    - models
    - flask
    vulnerable_parameter: request_data.get('password')
    malicious_payload: any_password
    exploit_explanation: The attacker can try any password to gain unauthorized access
      to the system.
    exploit_injected_example: login_user(request_data.get('password') = any_password)
    impact_summary: Attackers can gain unauthorized access to user accounts and sensitive
      data.
    cwe:
    - CWE-256
    - CWE-916
    owasp:
    - A02:2021
- id: fixora-wrapper-register-user
  patterns:
  - pattern-inside: "def register_user(...):\n  ..."
  - pattern-either:
    - pattern: User(...)
    - pattern: $OBJ.User(...)
    - pattern: db.session.add(...)
    - pattern: $OBJ.add(...)
    - pattern: add(...)
    - pattern: db.session.commit(...)
    - pattern: $OBJ.commit(...)
    - pattern: commit(...)
  message: '### Mass Assignment via `request_data`


    **Vulnerable Sink:** Passes untrusted data directly to `User, db.session.add,
    db.session.commit`.


    **Live Exploit Vector:**

    ```python\n// Target Function: register_user()\n// Parameter: request_data\n\n//
    Attacker executes:\nregister_user(request_data = {"username": "attacker", "password":
    "password", "email": "email@example.com", "admin": true})\n```


    **Outcome:**

    The attacker can create a new user with admin privileges by passing the ''admin''
    field in the request body.


    **Data at Risk (Impact):**

    Attackers can create new admin users and gain elevated access to the system.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Mass Assignment
    confidence: HIGH
    wrapper_defined_in: api_views/users.py
    wraps:
    - User
    - db.session.add
    - db.session.commit
    modules_used:
    - models
    - flask
    - jsonschema
    - config
    vulnerable_parameter: request_data
    malicious_payload: '{"username": "attacker", "password": "password", "email":
      "email@example.com", "admin": true}'
    exploit_explanation: The attacker can create a new user with admin privileges
      by passing the 'admin' field in the request body.
    exploit_injected_example: 'register_user(request_data = {"username": "attacker",
      "password": "password", "email": "email@example.com", "admin": true})'
    impact_summary: Attackers can create new admin users and gain elevated access
      to the system.
    cwe:
    - CWE-915
    owasp:
    - A03:2021
- id: fixora-wrapper-update-password
  patterns:
  - pattern-inside: "def update_password(...):\n  ..."
  - pattern-either:
    - pattern: User.query.filter_by(...)
    - pattern: $OBJ.filter_by(...)
    - pattern: filter_by(...)
    - pattern: db.session.commit(...)
    - pattern: $OBJ.commit(...)
    - pattern: commit(...)
  message: '### IDOR / Broken Access Control via `username`


    **Vulnerable Sink:** Passes untrusted data directly to `User.query.filter_by,
    db.session.commit`.


    **Live Exploit Vector:**

    ```python\n// Target Function: update_password()\n// Parameter: username\n\n//
    Attacker executes:\nupdate_password(username = another_user)\n```


    **Outcome:**

    The attacker can update the password of another user by passing the username in
    the request body.


    **Data at Risk (Impact):**

    Attackers can take control of other users'' accounts and gain unauthorized access
    to sensitive data.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: IDOR / Broken Access Control
    confidence: HIGH
    wrapper_defined_in: api_views/users.py
    wraps:
    - User.query.filter_by
    - db.session.commit
    modules_used:
    - config
    - flask
    - models
    vulnerable_parameter: username
    malicious_payload: another_user
    exploit_explanation: The attacker can update the password of another user by passing
      the username in the request body.
    exploit_injected_example: update_password(username = another_user)
    impact_summary: Attackers can take control of other users' accounts and gain unauthorized
      access to sensitive data.
- id: fixora-wrapper-update-email
  patterns:
  - pattern-inside: "def update_email(...):\n  ..."
  - pattern-either:
    - pattern: re.search(...)
    - pattern: $OBJ.search(...)
    - pattern: search(...)
    - pattern: User.query.filter_by(...)
    - pattern: $OBJ.filter_by(...)
    - pattern: filter_by(...)
    - pattern: db.session.commit(...)
    - pattern: $OBJ.commit(...)
    - pattern: commit(...)
  message: '### Input Validation Failure via `request_data.get(''email'')`


    **Vulnerable Sink:** Passes untrusted data directly to `re.search, User.query.filter_by,
    db.session.commit`.


    **Live Exploit Vector:**

    ```python\n// Target Function: update_email()\n// Parameter: request_data.get(''email'')\n\n//
    Attacker executes:\nupdate_email(request_data.get(''email'') = a@b.ca" * 10000)\n```


    **Outcome:**

    The attacker can cause a denial-of-service by passing a specially crafted email
    address that triggers the regex to take an excessive amount of time to process.


    **Data at Risk (Impact):**

    Attackers can cause the system to become unresponsive or crash.'
  severity: WARNING
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Input Validation Failure
    confidence: MEDIUM
    wrapper_defined_in: api_views/users.py
    wraps:
    - re.search
    - User.query.filter_by
    - db.session.commit
    modules_used:
    - jsonschema
    - config
    - re
    - models
    - flask
    vulnerable_parameter: request_data.get('email')
    malicious_payload: a@b.ca" * 10000
    exploit_explanation: The attacker can cause a denial-of-service by passing a specially
      crafted email address that triggers the regex to take an excessive amount of
      time to process.
    exploit_injected_example: update_email(request_data.get('email') = a@b.ca" * 10000)
    impact_summary: Attackers can cause the system to become unresponsive or crash.
    cwe:
    - CWE-400
    - CWE-1333
    owasp:
    - A03:2021

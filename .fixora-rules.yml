    - pattern: filter_by(...)
  message: '### IDOR / Broken Access Control via `admin`


    **Vulnerable Sink:** Passes untrusted data directly to `User.query.filter_by`.


    **Live Exploit Vector:**

    ```python\n// Target Function: register_user()\n// Parameter: admin\n\n// Attacker

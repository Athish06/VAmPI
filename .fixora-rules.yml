rules:
- id: fixora-wrapper-get-user
  patterns:
  - pattern-inside: "def get_user(...):\n  ..."
  - pattern-either:
    - pattern: db.session.execute(...)
    - pattern: $OBJ.execute(...)
    - pattern: execute(...)
  message: '### SQL Injection via `username`


    **Vulnerable Sink:** Passes untrusted data directly to `db.session.execute`.


    **Live Exploit Vector:**

    ```python\n// Target Function: get_user()\n// Parameter: username\n\n// Attacker
    executes:\nget_user(username = 1'' OR ''1''=''1)\n```


    **Outcome:**

    The attacker-controlled username is concatenated into the SQL WHERE clause, so
    the payload converts the predicate into an always-true condition.


    **Data at Risk (Impact):**

    Attackers can exfiltrate all rows from the users table and bypass authorization
    checks tied to user scoping.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: SQL Injection
    confidence: HIGH
    wrapper_defined_in: models/user_model.py
    wraps:
    - db.session.execute
    modules_used:
    - sqlalchemy
    vulnerable_parameter: username
    malicious_payload: 1' OR '1'='1
    exploit_explanation: The attacker-controlled username is concatenated into the
      SQL WHERE clause, so the payload converts the predicate into an always-true
      condition.
    exploit_injected_example: get_user(username = 1' OR '1'='1)
    impact_summary: Attackers can exfiltrate all rows from the users table and bypass
      authorization checks tied to user scoping.
    cwe:
    - CWE-89
    owasp:
    - A03:2021
- id: fixora-wrapper-register-user
  patterns:
  - pattern-inside: "def register_user(...):\n  ..."
  - pattern-either:
    - pattern: db.session.add(...)
    - pattern: $OBJ.add(...)
    - pattern: add(...)
    - pattern: db.session.commit(...)
    - pattern: $OBJ.commit(...)
    - pattern: commit(...)
  message: '### Mass Assignment via `request_data`


    **Vulnerable Sink:** Passes untrusted data directly to `db.session.add, db.session.commit`.


    **Live Exploit Vector:**

    ```python\n// Target Function: register_user()\n// Parameter: request_data\n\n//
    Attacker executes:\nregister_user(request_data = {"username": "test", "password":
    "test", "email": "test@example.com", "admin": true})\n```


    **Outcome:**

    The attacker-controlled request_data is passed directly to the User model constructor,
    allowing the attacker to set arbitrary fields, including the admin field.


    **Data at Risk (Impact):**

    Attackers can create admin users, gaining elevated privileges and access to sensitive
    data.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Mass Assignment
    confidence: HIGH
    wrapper_defined_in: api_views/users.py
    wraps:
    - db.session.add
    - db.session.commit
    modules_used:
    - flask
    - models
    vulnerable_parameter: request_data
    malicious_payload: '{"username": "test", "password": "test", "email": "test@example.com",
      "admin": true}'
    exploit_explanation: The attacker-controlled request_data is passed directly to
      the User model constructor, allowing the attacker to set arbitrary fields, including
      the admin field.
    exploit_injected_example: 'register_user(request_data = {"username": "test", "password":
      "test", "email": "test@example.com", "admin": true})'
    impact_summary: Attackers can create admin users, gaining elevated privileges
      and access to sensitive data.
    cwe:
    - CWE-915
    owasp:
    - A03:2021
- id: fixora-wrapper-login-user
  patterns:
  - pattern-inside: "def login_user(...):\n  ..."
  - pattern-either:
    - pattern: User.query.filter_by(...)
    - pattern: $OBJ.filter_by(...)
    - pattern: filter_by(...)
  message: '### Plaintext Password via `request_data.get(''password'')`


    **Vulnerable Sink:** Passes untrusted data directly to `User.query.filter_by`.


    **Live Exploit Vector:**

    ```python\n// Target Function: login_user()\n// Parameter: request_data.get(''password'')\n\n//
    Attacker executes:\nlogin_user(request_data.get(''password'') = test)\n```


    **Outcome:**

    The attacker-controlled password is compared directly to the stored password using
    the == operator, allowing the attacker to determine if the password is correct.


    **Data at Risk (Impact):**

    Attackers can determine if a password is correct, allowing them to gain unauthorized
    access to user accounts.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Plaintext Password
    confidence: HIGH
    wrapper_defined_in: api_views/users.py
    wraps:
    - User.query.filter_by
    modules_used:
    - flask
    - models
    vulnerable_parameter: request_data.get('password')
    malicious_payload: test
    exploit_explanation: The attacker-controlled password is compared directly to
      the stored password using the == operator, allowing the attacker to determine
      if the password is correct.
    exploit_injected_example: login_user(request_data.get('password') = test)
    impact_summary: Attackers can determine if a password is correct, allowing them
      to gain unauthorized access to user accounts.
    cwe:
    - CWE-256
    - CWE-916
    owasp:
    - A02:2021
